# PLAN19 (research only, research/PLAN19.md): hourly samples of order books on markets that pay Kalshi's liquidity
# rewards (2026-11-28 .. 2026-12-27 La Paz), the fill checks of each sample once its hour is over, the results of closed
# markets, and the single score from 2026-12-29 once every sample is checked and every closed market has a result (or
# from the 2027-01-05 backstop). Public Kalshi GETs only: it never places, changes or cancels an order, never touches
# trial/, paper.db or live.db, and commits only research/data/plan19 and research/results/plan19_result.* (it refuses
# to commit anything else). Since 2026-11-26 one run loops for about 5.5 hours (every 20 minutes: sample, fill checks,
# results, score, commit), because GitHub started only one of 48 scheduled 20-minute runs in 16 hours; a queued run
# takes over when it ends. One sample per clock hour
# (research/data/plan19/hours.json). Once research/results/plan19_result.json exists it does nothing.
name: PLAN19 hourly sample (research)
on:
  schedule:
    - cron: "5 * * * *"   # hourly; each run keeps sampling for about 5.5 hours (GitHub starts scheduled runs rarely)
  workflow_dispatch: {}
concurrency:
  group: tradebot-plan19   # its own group: a queued run never cancels a pending scan, settle or other plan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          ref: main   # the newest commit when the job starts: a run that waited its turn sees the run before it
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Loop for about 5.5 hours - sample, fill checks, results, (once) the score, and save after each pass
        env:
          TZ: America/La_Paz
          PYTHONIOENCODING: utf-8
        run: |
          git config user.name "tradebot-runner"
          git config user.email "tradebot-runner@users.noreply.github.com"
          save() {   # commits only research/data/plan19 and research/results/plan19_result.* (refuses anything else)
            others=$(git status --porcelain --untracked-files=all | grep -v -E '^.. "?research/(data/plan19/|results/plan19_result\.)' || true)
            if [ -n "$others" ]; then echo "refusing to commit: files outside research/data/plan19 and research/results/plan19_result.* changed:"; echo "$others"; return 1; fi
            find research/data/plan19 -name '*.tmp' -type f -delete 2>/dev/null || true
            git add -A -- research/results 2>/dev/null || true
            if [ -d research/data/plan19 ]; then git add -f -A -- research/data/plan19; fi
            git diff --cached --name-only | grep -v -E '^research/(data/plan19/|results/plan19_result\.)' && { echo "refusing: staged files outside research/data/plan19 and research/results/plan19_result.*"; return 1; }
            git commit -q -m "PLAN19 sample $(date -u +%FT%H:%MZ)" || { echo "nothing new"; return 0; }
            for i in 1 2 3 4 5 6; do
              git push -q origin HEAD:main && return 0
              sleep $((i * 10))
              git pull -q --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            done
            return 1
          }
          end=$(( $(date +%s) + 330*60 )); rc=0
          while :; do
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            if [ -f research/results/plan19_result.json ]; then echo "PLAN19 is already scored: nothing to do"; break; fi
            python research/plan19.py sample || rc=1
            python research/plan19.py settle || rc=1
            python research/plan19.py auto-score || rc=1
            save || rc=1
            now=$(date +%s); next=$(( (now/1200 + 1)*1200 + 300 ))   # the next :05, :25 or :45
            [ $next -ge $end ] && break
            sleep $(( next - now ))
          done
          exit $rc
