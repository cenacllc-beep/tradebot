# PLAN17 (research only, research/PLAN17.md): can a small frozen model pick cheap (1-5c) sides of Kalshi's 15-minute
# BTC and ETH markets at minutes 10-13 that win more often than their price says? Fitted once on September windows,
# scored once per asset on October windows. Started by hand only (workflow_dispatch), one stage per run. Public data
# only: Coinbase Exchange's public one-minute candles (approved by the user 2026-11-12) read in memory, and PLAN15's
# saved day files. It never places, changes or cancels an order, never touches trial/, paper.db or live.db, never reads
# PLAN15's check period, and commits only research/results/plan17* (it refuses to commit anything else). Raw Coinbase
# candles are never written (only derived values per window). freeze runs once; every other stage refuses until
# research/results/plan17_identity.json is committed and unchanged; fit refuses if a model was ever committed; a score
# refuses if that asset's result was ever committed.
name: PLAN17 cheap reversals (research)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "freeze (once, first) | download | fit (once) | score | status"
        required: true
        type: choice
        options: [status, freeze, download, fit, score]
      asset:
        description: "score only: BTC or ETH"
        required: false
        default: ""
      max_days:
        description: "download only: at most this many asset-days in this run (empty = no limit)"
        required: false
        default: ""
concurrency:
  group: tradebot-plan17
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          ref: main
          fetch-depth: 0   # full history: the score guard looks for any earlier result commit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - name: Refuse freeze when the code is already frozen
        if: inputs.stage == 'freeze'
        run: |
          if git ls-files --error-unmatch research/results/plan17_identity.json >/dev/null 2>&1; then
            echo "already frozen: research/results/plan17_identity.json is committed; it is stored once"; exit 1
          fi
      - name: Refuse every other stage unless the identity record is committed and unchanged
        if: inputs.stage != 'freeze'
        run: |
          f=research/results/plan17_identity.json
          git ls-files --error-unmatch "$f" >/dev/null 2>&1 || { echo "$f is not committed: run the freeze stage first"; exit 1; }
          git diff --quiet HEAD -- "$f" || { echo "$f differs from the commit: stopping"; exit 1; }
      - name: Refuse a second fit
        if: inputs.stage == 'fit'
        run: |
          if git log --oneline -- research/results/plan17_model.json | grep -q .; then echo "the model was committed once: fitted once"; exit 1; fi
      - name: Refuse a second score of the asset
        if: inputs.stage == 'score'
        env:
          ASSET: ${{ inputs.asset }}
        run: |
          case "$ASSET" in (BTC|ETH) ;; (*) echo "asset must be BTC or ETH"; exit 1;; esac
          git ls-files --error-unmatch research/results/plan17_model.json >/dev/null 2>&1 || { echo "no committed model: run fit first"; exit 1; }
          for f in "research/results/plan17_result_$ASSET.json" "research/results/plan17_result_$ASSET.md"; do
            if git log --oneline -- "$f" | grep -q .; then echo "$f was committed once: each asset is scored once"; exit 1; fi
          done
      - name: Run the stage
        env:
          TZ: UTC
          PYTHONIOENCODING: utf-8
          STAGE: ${{ inputs.stage }}
          MAX_DAYS: ${{ inputs.max_days }}
          ASSET: ${{ inputs.asset }}
        run: |
          extra=""
          if [ -n "$MAX_DAYS" ]; then
            case "$MAX_DAYS" in (*[!0-9]*) echo "max_days must be a whole number"; exit 1;; esac
            extra="--max-days $MAX_DAYS"
          fi
          case "$STAGE" in
            download) python research/plan17.py download --budget-minutes 300 $extra ;;
            score) python research/plan17.py score "$ASSET" ;;
            freeze|fit|status) python research/plan17.py "$STAGE" ;;
            *) echo "unknown stage $STAGE"; exit 1 ;;
          esac
      - name: Save research/results/plan17* in the repository (and nothing else)
        if: always() && inputs.stage != 'status'
        run: |
          others=$(git status --porcelain --untracked-files=all | grep -v -E '^.. "?research/results/plan17' || true)
          if [ -n "$others" ]; then echo "refusing to commit: files outside research/results/plan17* changed:"; echo "$others"; exit 1; fi
          big=$(find research/results -path 'research/results/plan17*' -type f -size +50M)
          if [ -n "$big" ]; then echo "refusing to commit files over 50 MB:"; echo "$big"; exit 1; fi
          find research/results -path 'research/results/plan17*' -name '*.tmp' -type f -delete
          git config user.name "tradebot-runner"
          git config user.email "tradebot-runner@users.noreply.github.com"
          git add -A -- 'research/results/plan17*'
          git diff --cached --name-only | grep -v -E '^research/results/plan17' && { echo "refusing: staged files outside research/results/plan17*"; exit 1; }
          git commit -m "PLAN17 $STAGE $(date -u +%FT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git push origin HEAD:main && exit 0
            sleep $((i * 10))
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
          done
          exit 1
        env:
          STAGE: ${{ inputs.stage }}
