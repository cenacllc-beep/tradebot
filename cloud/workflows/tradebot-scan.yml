# Copy to .github/workflows/ in the private "tradebot" repository. Paper trading only, on its own trial database
# (trial/paper.db). No Kalshi keys exist in the repository, and live.py is never run here.
name: tradebot evening scan (trial)
on:
  schedule:
    - cron: "55 0 * * *"   # 00:55 UTC = 8:55 PM La Paz, as on the PC. GitHub can start scheduled runs late; the scan runs if it starts before 1:00 AM.
  workflow_dispatch: {}
concurrency:
  group: tradebot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Scan (paper only; trial/paper.db, never the PC's database)
        working-directory: trial
        env:
          TRADEBOT_OFFSITE_BACKUPS: offsite
          TZ: America/La_Paz
        run: |
          # the same evening window as the PC (scan_window.py): 8:50 PM to 1:00 AM La Paz. A run started outside it (a late
          # GitHub start, or a test run by hand) does not scan, so the trial keeps the designed evening snapshot.
          if ! python ../scan_window.py; then echo "outside the scan window: not scanning (a test run checks the setup only)"; exit 0; fi
          python ../backup.py prescan || echo "no trial database yet"
          # up to 3 tries, 5 minutes apart (as jobs.py on the PC): a retried scan is safe, obs keeps each market's first snapshot
          ok=0
          for try in 1 2 3; do
            if python ../main.py scan; then ok=1; break; fi
            echo "scan try $try failed"; [ "$try" -lt 3 ] && sleep 300
          done
          [ "$ok" = 1 ] || { echo "scan: all 3 tries failed"; exit 1; }
          python ../shadow.py scan || echo "shadow step failed; the main bot is not affected"
          python ../backup.py postscan || echo "backup failed (the repository history keeps every version anyway)"
          python ../dashboard.py --no-open || echo "dashboard failed"
      - name: Save the trial results in the repository (its history is the off-machine backup)
        if: always()
        run: |
          git config user.name "tradebot-runner"
          git config user.email "tradebot-runner@users.noreply.github.com"
          git add trial
          git commit -m "trial scan $(date -u +%F)" || echo "nothing new"
          git push
