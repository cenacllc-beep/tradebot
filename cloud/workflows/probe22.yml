# PROBE22 (research only, research/PLAN22.md section 7): how far back Deribit's hourly DVOL history goes, its page size,
# its timestamp convention and whether past candles are revised - before PLAN22 is frozen. Counts, timestamps, ranges,
# SHA-256 hashes and field names only: no DVOL value is printed or saved. Nothing dated 2026-11-01 or later is requested.
# Started by hand only; run it twice, on two days at least 24 hours apart, for the revision check. Standard library only
# (no package installed). Read-only public data from www.deribit.com (approved by the user 2026-11-26 20:20 La Paz):
# GETs only, no account, no key. Never places, changes or cancels an order; commits only research/results/probe22*.
name: PROBE22 Deribit DVOL history (research)
on:
  workflow_dispatch: {}
concurrency:
  group: tradebot-probe22
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - name: Refuse to run unless research/results/probe22.json is as committed
        run: |
          f=research/results/probe22.json
          git diff --quiet HEAD -- "$f" || { echo "$f differs from the commit: stopping"; exit 1; }
          if [ -n "$(git status --porcelain --untracked-files=all -- "$f")" ]; then echo "$f is not as committed: stopping"; exit 1; fi
      - name: Probe
        env:
          TZ: UTC
          PYTHONIOENCODING: utf-8
        run: python research/probe22.py
      - name: Save research/results/probe22* (and nothing else)
        if: always()
        run: |
          others=$(git status --porcelain --untracked-files=all | grep -v -E '^.. "?research/results/probe22' || true)
          if [ -n "$others" ]; then echo "refusing to commit: other files changed:"; echo "$others"; exit 1; fi
          find research/results -maxdepth 1 -name 'probe22*.tmp' -type f -delete
          git config user.name "tradebot-runner"
          git config user.email "tradebot-runner@users.noreply.github.com"
          git add -A -- 'research/results/probe22*'
          git diff --cached --name-only | grep -v -E '^research/results/probe22' && { echo "refusing: staged files outside research/results/probe22*"; exit 1; }
          git commit -m "PROBE22 $(date -u +%FT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git push origin HEAD:main && exit 0
            sleep $((i * 10))
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
          done
          exit 1
